version: v1

defaults:
  task_type: tabular_regression
  eval_metrics:
    - r2
    - rmse
    - mae
  seeds: [0, 1, 2, 3, 4]
  target_exclusion_rule: drop_target_from_features
  drop_rows_with_missing_target: true
  eval_split_policy:
    source_train_splits: [train]
    target_train_splits: [train]
    target_eval_splits: [external, test]
    remove_eval_subjects_from_target_train: true

benchmarks:
  - benchmark_id: std_same_nh_v1
    description: Same-cohort NHANES baseline upper bound.
    setting: same_cohort
    train_dataset: nhanes
    test_dataset: nhanes
    feature_set: full_numeric_samecohort_v1
    target_set: clean_main_targets_v1
    fewshot_fracs: [0.0]
    adaptation_policy: none
    mask_target_cohort_only: false
    observed_slots: []

  - benchmark_id: std_same_kn_v1
    description: Same-cohort KNHANES baseline upper bound.
    setting: same_cohort
    train_dataset: knhanes
    test_dataset: knhanes
    feature_set: full_numeric_samecohort_v1
    target_set: clean_main_targets_v1
    fewshot_fracs: [0.0]
    adaptation_policy: none
    mask_target_cohort_only: false
    observed_slots: []

  - benchmark_id: std_cross_nh2kn_shared_v1
    description: Cross-cohort baseline using shared clinical slots only.
    setting: cross_cohort_shared
    train_dataset: nhanes
    test_dataset: knhanes
    feature_set: shared_clinical_v1
    target_set: clean_main_targets_v1
    fewshot_fracs: [0.0]
    adaptation_policy: none
    mask_target_cohort_only: false
    observed_slots: []

  - benchmark_id: std_cross_kn2nh_shared_v1
    description: Cross-cohort baseline using shared clinical slots only.
